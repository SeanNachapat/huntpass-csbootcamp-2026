version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoostamp-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the local SQLite database so data persists and is shared with local development
      - ./dev.db:/app/dev.db

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zoostamp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
