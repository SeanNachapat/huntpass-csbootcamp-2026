services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoostamp-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      # Bind-mount the local SQLite database so data persists and is shared with local development
      - ./dev.db:/app/data/dev.db

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zoostamp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
